<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUNDAY MORNING EXPERIENCE</title>
    <!-- Google Fonts for Sleek Morning Church Editorial & Architectural Look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/display.css?v=5">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <!-- Live 60fps Sanctuary Stage Curtain (Controlled remotely from /remote) -->
    <div id="stage-curtain" class="curtain-closed" aria-hidden="false">
        <div class="curtain-light-spill"></div>
        <canvas id="curtain-canvas"></canvas>
    </div>

    <!-- Interactive Background Canvas (Sunbeams, Acoustic Shockwaves, Golden Particles) -->
    <canvas id="fx-canvas"></canvas>

    <!-- Subtle Architectural Frame -->
    <div class="stage-frame"></div>

    <!-- Top Header: Clean Connection & Live dB Pill (Group Status Bar Removed) -->
    <header id="top-bar">
        <div id="debug-info">
            <span id="connection-dot"></span>
            <span id="connection-status">DISCONNECTED</span>
        </div>

        <div id="live-db-pill">
            <span class="live-label">LIVE</span>
            <span id="score-live">0 dB</span>
        </div>
    </header>

    <!-- Center Stage Lockup (Optically & Geometrically Centered) -->
    <main id="main-container">
        <div id="stage-eyebrow">GOD IS FAITHFUL</div>
        <div id="word-wrapper">
            <h1 id="jesus-text" data-stage="0">JESUS</h1>
        </div>
        <div id="tier-badge">★ GOD IS FAITHFUL ★</div>

        <!-- Unlock Countdown Bar (Appears for 5s when Tier 4 is reached) -->
        <div id="unlock-container" class="hidden">
            <div id="unlock-label">CROWN OF GLORY — UNLOCKING NEXT WORD</div>
            <div class="unlock-track">
                <div id="unlock-fill"></div>
            </div>
        </div>
    </main>

    <!-- Bottom Bar: Sleek Architectural Tier Meter & Max Energy Scoreboard -->
    <footer id="bottom-bar">
        <div id="stage-meter-wrap">
            <div class="meter-tiers">
                <span class="meter-tag" id="m-tier-1">105 dB · DAWN</span>
                <span class="meter-tag" id="m-tier-2">110 dB · GOLD</span>
                <span class="meter-tag" id="m-tier-3">115 dB · AMBER</span>
                <span class="meter-tag" id="m-tier-4">120 dB · UNLOCK</span>
            </div>
            <div class="stage-meter-track">
                <div id="stage-meter-fill"></div>
                <div class="stage-tick" style="left: 72.22%"></div>
                <div class="stage-tick" style="left: 77.78%"></div>
                <div class="stage-tick" style="left: 83.33%"></div>
                <div class="stage-tick" style="left: 88.89%"></div>
            </div>
        </div>

        <div id="scoreboard">
            <div class="score-label">PEAK PRAISE</div>
            <div class="score-value" id="score-peak">0 dB</div>
        </div>
    </footer>

    <script src="/js/display.js?v=6"></script>
</body>
</html>
